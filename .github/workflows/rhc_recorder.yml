name: Robinhood Chain recorder

on:
  schedule:
    - cron: "7,37 * * * *"   # best-effort backup; a cron-job.org timer dispatches this every 30 min with auto=true
    # every 30 min: GeckoTerminal lists only 10 pages (200 pools) of new pools, and busy hours launch ~200
  workflow_dispatch:
    inputs:
      auto:
        description: "Started by a timer: skip if the last run is under 20 minutes old"
        type: boolean
        default: false
      snapshot:
        description: "Force a snapshot run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rhc-recorder        # its own group: never overlaps itself, never waits on the collector or the radar
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Skip if the last run is fresh
        id: gate
        if: github.event_name == 'schedule' || inputs.auto
        run: |
          age=$(python3 -c "import json,time; print(int(time.time() - json.load(open('rhc_recorder/data/state.json'))['last_run']))" 2>/dev/null || echo 999999)
          echo "last run ${age}s ago"
          if [ "$age" -lt 1200 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - run: pip install "requests>=2.31" "pyyaml>=6"
        if: steps.gate.outputs.skip != 'true'

      - name: Record
        if: steps.gate.outputs.skip != 'true'
        run: python rhc_recorder/run.py ${{ inputs.snapshot && '--snapshot' || '' }}

      - name: Save results
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          git add rhc_recorder/data/ docs/alpha.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "rhc: $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 7
          done
          exit 1
