name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip install requests -q
          python3 - <<'EOF'
          import requests
          for url in ["https://api.rugcheck.xyz/v1/tokens/JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN/report",
                      "https://api.rugcheck.xyz/v1/tokens/JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN/report/summary"]:
              try:
                  r = requests.get(url, headers={"User-Agent": "rhc-recorder/1.0 (github.com/battlemaster69/Cockpit)"}, timeout=40)
                  print("RESULT", r.status_code, len(r.text), url)
              except Exception as e:
                  print("RESULT ERR", str(e)[:80], url)
          EOF
