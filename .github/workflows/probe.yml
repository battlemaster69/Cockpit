name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'EOF'
          import urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          for url in ["https://www.theblock.co/api/charts/chart/crypto-markets/bitcoin-etf/spot-bitcoin-etf-flows",
                      "https://www.theblock.co/api/charts/chart/crypto-markets/ethereum-etf/spot-ethereum-etf-flows",
                      "https://www.theblock.co/api/charts/chart/crypto-markets/solana-etf/spot-solana-etf-flows",
                      "https://www.theblock.co/api/charts/chart/crypto-markets/xrp-etf/spot-xrp-etf-flows",
                      "https://farside.co.uk/btc/"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30)
                  print("OK ", r.status, len(r.read()), url)
              except Exception as e:
                  print("ERR", str(e)[:80], url)
          EOF
