<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14222B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9EEF0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cockpit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14222B; --panel: #1B2E39; --face: #213847; --line: #2D4553;
  --ink: #E4ECEF; --dim: #8EA2AC; --faint: #5E7480;
  --ok: #46C08A; --warn: #E2A83E; --hot: #E2604C; --idle: #6B808B;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #E9EEF0; --panel: #FFFFFF; --face: #F3F6F7; --line: #D2DCE1;
    --ink: #142530; --dim: #566C77; --faint: #8A9DA6;
    --ok: #1F9A63; --warn: #B87A0C; --hot: #C7412E; --idle: #8A9DA6;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 40px; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 4px; }

/* header */
header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 2px 10px; }
h1 { font-family: var(--num); font-weight: 700; font-size: 1.5rem; letter-spacing: .01em; margin: 0; }
.stamp { color: var(--dim); font-size: .85rem; }
.stamp.stale { color: var(--warn); }

/* gauges: the one loud element */
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gauge { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 12px; }
.gauge-top { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
.gauge-name { font-family: var(--num); font-weight: 600; font-size: 1.05rem; }
.gauge-px { color: var(--dim); font-size: .8rem; font-variant-numeric: tabular-nums; }
.gauge svg { display: block; width: 100%; height: auto; margin-top: 2px; }
.gauge-read { text-align: center; margin-top: 4px; }
.gauge-val { font-family: var(--num); font-weight: 700; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge-state { font-weight: 600; font-size: .88rem; margin-top: 3px; }
.gauge-sub { display: flex; justify-content: space-between; color: var(--dim); font-size: .76rem; margin-top: 8px; padding: 0 2px; font-variant-numeric: tabular-nums; }
.needle { transform-origin: 70px 70px; transition: transform 1.1s cubic-bezier(.2,.9,.25,1.05); }
@media (prefers-reduced-motion: reduce) { .needle { transition: none; } }

.verdict { margin: 12px 2px 0; color: var(--ink); font-size: .95rem; }
.verdict b { font-weight: 600; }
.errors { margin: 10px 0 0; padding: 9px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); font-size: .82rem; }

/* tabs */
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin: 16px -14px 0; padding: 8px 14px; }
.tabs { display: flex; gap: 2px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: none; padding: 8px 9px; font-size: .92rem; border-radius: 8px; font-weight: 500; color: var(--dim); white-space: nowrap; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--face); color: var(--ink); font-weight: 600; }

section[hidden] { display: none; }
h2 { font-family: var(--num); font-weight: 600; font-size: 1.15rem; margin: 22px 2px 4px; }
.hint { color: var(--dim); font-size: .85rem; margin: 0 2px 10px; max-width: 62ch; }

/* coins */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 8px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: .85rem; color: var(--dim); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.coin { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.coin summary { list-style: none; display: grid; grid-template-columns: 14px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
.coin summary::-webkit-details-marker { display: none; }
.light { width: 12px; height: 12px; border-radius: 50%; }
.light.green { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.light.amber { background: var(--warn); }
.light.red { background: var(--hot); }
.light.grey { background: var(--idle); }
.sym { font-family: var(--num); font-weight: 700; font-size: 1.12rem; }
.sub { color: var(--dim); font-size: .82rem; font-variant-numeric: tabular-nums; }
.score { text-align: right; }
.score-big { font-family: var(--num); font-weight: 700; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score-big small { font-size: .85rem; color: var(--dim); font-weight: 500; }
.coin-body { padding: 2px 14px 14px; border-top: 1px solid var(--line); }
.bars { display: grid; gap: 7px; margin: 12px 0 14px; }
.bar-row { display: grid; grid-template-columns: 112px 1fr 28px; gap: 10px; align-items: center; font-size: .84rem; }
.bar-row span:first-child { color: var(--dim); }
.bar { position: relative; height: 8px; background: var(--face); border-radius: 4px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ink); opacity: .85; }
.bar em { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--warn); }
.bar-row b { font-family: var(--num); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.legend { color: var(--dim); font-size: .76rem; margin: -6px 0 12px; }
.legend em { display: inline-block; width: 2px; height: 10px; background: var(--warn); margin: 0 4px -1px 0; }
.checks { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: .88rem; }
.checks .why { display: block; color: var(--dim); font-size: .8rem; }
.mark { font-weight: 700; text-align: center; }
.mark.y { color: var(--ok); } .mark.n { color: var(--hot); } .mark.u { color: var(--idle); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 0 0 10px; font-size: .84rem; }
.stats div span { display: block; color: var(--dim); font-size: .76rem; }
.stats div b { font-weight: 600; font-variant-numeric: tabular-nums; }
.note { color: var(--warn); font-size: .82rem; margin: 0 0 8px; }
.links { display: flex; gap: 14px; font-size: .84rem; }
.links a { color: var(--dim); }

/* tables & panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
th { text-align: right; color: var(--dim); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
tr:last-child td { border-bottom: 0; }
.good { color: var(--ok); } .bad { color: var(--hot); } .meh { color: var(--warn); }
.metric { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 12px; }
.metric .label { color: var(--dim); font-size: .85rem; }
.metric .val { font-family: var(--num); font-weight: 700; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metric .chg { font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }
.metric svg { grid-column: 1 / -1; width: 100%; height: 42px; display: block; margin-top: 6px; }
.metric p { grid-column: 1 / -1; margin: 6px 0 0; color: var(--dim); font-size: .82rem; }
.tx { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
.tx:last-child { border-bottom: 0; }
.tx .when { color: var(--dim); font-size: .78rem; }
.alert { padding: 10px 0; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert b { font-weight: 600; }
.alert p { margin: 2px 0 0; color: var(--dim); font-size: .85rem; }
.empty { text-align: center; color: var(--dim); padding: 40px 10px; }
footer { color: var(--faint); font-size: .76rem; margin-top: 26px; text-align: center; }

/* v2 additions */
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; }
.head-right { display: flex; align-items: center; gap: 10px; }
.toolbar { display: grid; grid-template-columns: minmax(0, 1fr) 9.5rem; gap: 8px; margin: 14px 0 4px; }
.search { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); font: inherit; }
.search::placeholder { color: var(--faint); }
select.sort { width: 100%; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: inherit; padding: 9px 8px; }
.count { color: var(--dim); font-size: .82rem; margin: 2px 2px 8px; }
.row { display: grid; grid-template-columns: 14px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 7px; cursor: pointer; }
.row .name { color: var(--dim); font-size: .8rem; margin-left: 6px; }
.star { color: var(--warn); font-size: .8rem; margin-left: 4px; }
.tag { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); margin-left: 6px; vertical-align: 2px; }
.more { display: block; width: 100%; margin: 6px 0 0; padding: 11px; border-radius: 12px; border: 1px dashed var(--line); background: none; color: var(--dim); cursor: pointer; }
tr.click { cursor: pointer; }

/* detail sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(5, 12, 16, .55); z-index: 20; }
.sheet { position: fixed; inset: 0; z-index: 21; overflow-y: auto; background: var(--bg); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
@media (min-width: 640px) { .sheet { inset: 4vh 0 0 0; max-width: 560px; margin: 0 auto; border-radius: 18px 18px 0 0; border: 1px solid var(--line); } }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-title { font-family: var(--num); font-weight: 700; font-size: 1.4rem; }
.sheet-title small { font-family: var(--body); font-weight: 400; color: var(--dim); font-size: .9rem; margin-left: 6px; }
.sheet-body { padding: 4px 16px 32px; }
.sheet h3 { font-family: var(--num); font-weight: 600; font-size: 1.05rem; margin: 20px 0 8px; }
.pricebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
.pricebar .big { font-family: var(--num); font-weight: 700; font-size: 1.8rem; }
.pricebar span { font-size: .86rem; }
.totalline { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 2px; }
.totalline .score-big { font-size: 2.2rem; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.bar-row .src { font-size: .7rem; color: var(--faint); display: block; }
.bar.none { background: repeating-linear-gradient(90deg, var(--face) 0 6px, transparent 6px 10px); }
.badge { display: inline-block; padding: 6px 10px; border-radius: 8px; background: var(--face); color: var(--dim); font-size: .84rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 40; max-width: 90vw; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { color: var(--dim); font-size: .84rem; }
.field input { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); font: inherit; }
.steps { padding-left: 20px; margin: 0 0 14px; color: var(--dim); font-size: .88rem; }
.steps li { margin-bottom: 4px; }
.spark-wrap svg { width: 100%; height: 56px; display: block; }
.pos { margin-top: 12px; padding: 6px 10px; }
.pos table { font-size: .82rem; }
.pos th, .pos td { padding: 7px 4px; }
.pos td small { color: var(--dim); font-size: .72rem; margin-left: 2px; }
.pos + .hint { margin-top: -2px; }
.srow { grid-template-columns: minmax(0, 1fr) 64px auto; }
.srow .mini svg { width: 64px; height: 26px; display: block; }
.srow .big { font-family: var(--num); font-weight: 700; font-size: 1.25rem; line-height: 1.1; text-align: right; font-variant-numeric: tabular-nums; }
.srow .sub { display: block; }
.srow .tag { white-space: nowrap; }
.tag.good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.tag.bad { color: var(--hot); border-color: color-mix(in srgb, var(--hot) 50%, transparent); }
.tag.meh { color: var(--dim); }
.tag.hot { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cockpit</h1>
    <span class="head-right">
      <span class="stamp" id="stamp">Loading</span>
      <button class="icon-btn" id="open-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </span>
  </header>
  <div id="app"></div>
  <footer>Free data from Hyperliquid, Coinalyze, CoinGecko, DefiLlama, FRED, CoinMetrics, Etherscan and public BNB Chain and Solana nodes. Not financial advice.</footer>
</div>
<div id="layer"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = v => {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a >= 0.9995e12) return "$" + (v / 1e12).toFixed(2) + "T";
  if (a >= 0.9995e9) return "$" + (v / 1e9).toFixed(2) + "B";
  if (a >= 0.9995e6) return "$" + (v / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return "$" + (v / 1e3).toFixed(0) + "K";
  return "$" + v.toFixed(0);
};
const price = v => {
  if (v == null) return "–";
  if (v >= 1000) return "$" + v.toLocaleString("en-US", { maximumFractionDigits: 0 });
  if (v >= 1) return "$" + v.toFixed(2);
  if (v >= 0.01) return "$" + v.toFixed(4);
  return "$" + v.toPrecision(3);
};
const pct = (v, d = 1) => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : "") + v.toFixed(d) + "%";
const tone = (v, goodIfUp = true) => v == null ? "" : ((v > 0) === goodIfUp ? "good" : "bad");
const ago = iso => {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
};
const agoTs = ts => ago(new Date(ts * 1000).toISOString());
// clock time in the phone's own timezone, with the date when it isn't today
const clock = iso => {
  const d = new Date(iso), t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + t;
};
const when = iso => `${clock(iso)} (${ago(iso)})`;
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function spark(values, color = "var(--ink)", h = 42) {
  const v = (values || []).filter(x => x != null && isFinite(x));
  if (v.length < 2) return "";
  const w = 300, min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 4 - (y - min) / span * (h - 8)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

/* ================= state ================= */
let DATA = null, UNI = null, RADAR = null, BYID = new Map();
let SHORT = new Set();
let current = (location.hash.slice(1) || "shortlist").split("/")[0];
const ui = { q: "", sort: "total", filter: "all", shown: 40, lsort: "dist" };
const store = {
  get(k, d = null) { try { return JSON.parse(localStorage.getItem("cockpit:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cockpit:" + k, JSON.stringify(v)); } catch {} },
};
function repoGuess() {
  const host = location.hostname, m = host.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split("/").filter(Boolean)[0] || "";
  return { owner: m ? m[1] : "", repo };
}
function gh() {
  const g = repoGuess();
  return { owner: store.get("owner") || g.owner, repo: store.get("repo") || g.repo, token: store.get("token") || "" };
}

/* ================= GitHub shortlist sync ================= */
const SL_PATH = "docs/shortlist.json";
async function ghFetchShortlist() {
  const { owner, repo, token } = gh();
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${SL_PATH}?t=${Date.now()}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }, cache: "no-store" });
  if (!r.ok) throw new Error(r.status === 401 ? "Token rejected" : r.status === 404 ? "Repo or file not found" : "GitHub error " + r.status);
  const j = await r.json();
  const text = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
  return { sha: j.sha, coins: (JSON.parse(text).coins || []) };
}
async function ghSaveShortlist(mutate, message) {
  const { owner, repo, token } = gh();
  for (let attempt = 0; attempt < 2; attempt++) {
    const cur = await ghFetchShortlist();
    const next = mutate([...cur.coins]);
    const body = JSON.stringify({ coins: next }, null, 0) + "\n";
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${SL_PATH}`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(body))), sha: cur.sha }),
    });
    if (r.ok) return next;
    if (r.status !== 409 && r.status !== 422) throw new Error(r.status === 403 ? "Token lacks write access" : "GitHub error " + r.status);
  }

}

          <div><span>Nearest level</span><b>${price(x.level)} (turned ${x.bounce_touches}×)</b></div><div><span>Distance</span><b>${p100(x.dist)}</b></div>
          <div><span>Ceiling overhead</span><b>${x.resistance ? `${price(x.resistance)} (${p100(x.room, 0)})` : x.clear_of_resistance ? "clear of all" : "–"}</b></div>
          <div><span>Typical weekly swing</span><b class="${x.swing_amplitude >= DATA.levels.settings.max_weekly_swing_pct / 100 ? "meh" : ""}">${(x.swing_amplitude * 100).toFixed(1)}%</b></div>
          <div><span>2 weeks after past touches</span><b>${x.bounce_resolved_10d ? `${p100(x.bounce_median_10d)} median, ${Math.round(x.bounce_hit_rate_10d * 100)}% up (${x.bounce_resolved_10d})` : "–"}</b></div>
          <div><span>Last touch</span><b>${esc(x.bounce_last_touch || "–")}</b></div></div>`; })()}
      <div class="links" style="margin-top:18px">
        <a href="https://www.coingecko.com/en/coins/${esc(c.id)}" target="_blank" rel="noopener">CoinGecko</a>
        <a href="https://tokenomist.ai/search?q=${encodeURIComponent(c.sym)}" target="_blank" rel="noopener">Unlocks</a>
        <a href="https://www.coinglass.com/currencies/${encodeURIComponent(c.sym)}" target="_blank" rel="noopener">Coinglass</a>
        ${f ? `<a href="https://defillama.com/search?q=${encodeURIComponent(c.name)}" target="_blank" rel="noopener">DefiLlama</a>` : ""}
      </div>
    </div>`;
}
function openSheet(id, replace = false) {
  const c = coin(id); if (!c) return;
  if (!replace) { lastFocus = document.activeElement; history.pushState({ sheet: id }, "", "#" + current + "/" + id); }
  $("#layer").innerHTML = `<div class="sheet-back" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${detail(c)}</div>`;
  document.body.style.overflow = "hidden";
  $(".sheet [data-close]")?.focus();
}
function closeSheet(fromPop = false) {
  if (!$("#layer").innerHTML) return;
  $("#layer").innerHTML = ""; document.body.style.overflow = "";
  if (!fromPop && history.state?.sheet) history.back();
  lastFocus?.focus?.();
}

/* ================= settings ================= */
function openSettings(note = "") {
  const g = gh(); if (!$("#layer").innerHTML) lastFocus = document.activeElement;
  $("#layer").innerHTML = `<div class="sheet-back" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="sheet-head"><span class="sheet-title" id="set-title">Shortlist sync</span>
      <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body">
      ${note ? `<p class="errors">${esc(note)}</p>` : ""}
      <p class="hint" style="margin-top:12px">Editing the shortlist saves <code>docs/shortlist.json</code> in your repo, which tells the tracker what to watch hourly. That needs a GitHub token, stored only in this browser.</p>
      <ol class="steps">
        <li>On GitHub: Settings, Developer settings, Personal access tokens, <b>Fine-grained tokens</b>, Generate new token.</li>
        <li>Repository access: <b>Only select repositories</b>, pick this repo.</li>
        <li>Permissions: <b>Contents: Read and write</b>. Nothing else.</li>
        <li>Generate, copy, paste below.</li>
      </ol>
      <div class="field"><label for="f-owner">GitHub username</label><input id="f-owner" value="${esc(g.owner)}" autocomplete="off" autocapitalize="off"></div>
      <div class="field"><label for="f-repo">Repository name</label><input id="f-repo" value="${esc(g.repo)}" autocomplete="off" autocapitalize="off"></div>
      <div class="field"><label for="f-token">Token</label><input id="f-token" type="password" value="${esc(g.token)}" placeholder="github_pat_…" autocomplete="off"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" data-save-settings>Save and test</button>
        ${g.token ? `<button class="btn" data-forget>Forget token</button>` : ""}
      </div>
      <p class="hint" id="set-status" style="margin-top:12px"></p>
    </div></div>`;
  document.body.style.overflow = "hidden";
  if (history.state?.sheet) history.replaceState({ sheet: "settings" }, "", location.hash);
  else history.pushState({ sheet: "settings" }, "", location.hash);
  $("#f-token").focus();
}
async function saveSettings() {
  store.set("owner", $("#f-owner").value.trim()); store.set("repo", $("#f-repo").value.trim()); store.set("token", $("#f-token").value.trim());
  const st = $("#set-status"); st.textContent = "Testing";
  try { const r = await ghFetchShortlist(); SHORT = new Set(r.coins); st.innerHTML = `<span class="good">Connected.</span> ${r.coins.length} coins on your shortlist.`; render(); }
  catch (e) { st.innerHTML = `<span class="bad">${esc(e.message)}.</span> Check the username, repo name and token permissions.`; }
}

/* ================= shell ================= */
function render() {
  const mk = DATA.markets || {};
  const order = [["BTC", "BTC"], ["ETH", "ETH"], ["SOL", "SOL"], ["ALTS", "Alts"]].filter(([k]) => mk[k]);
  const errs = Object.entries(DATA.errors || {});
  $("#app").innerHTML = `
    ${order.length ? `<div class="gauges">${order.map(([k, n]) => gauge(n, mk[k])).join("")}</div><p class="verdict">${verdict(mk)}</p>${positioning(mk)}` : `<p class="empty">Leverage data unavailable this run.</p>`}
    ${errs.length ? `<p class="errors">${errs.length} source${errs.length > 1 ? "s" : ""} didn't update: ${errs.map(([k, v]) => `<b>${esc(k)}</b> (${esc(v)})`).join("; ")}</p>` : ""}
    <nav><div class="tabs" role="tablist">${TABS.map(([id, l]) => `<button role="tab" data-tab="${id}" aria-selected="${id === current}">${l}</button>`).join("")}</div></nav>
    ${TABS.map(([id, , fn]) => `<section role="tabpanel" id="tab-${id}" ${id === current ? "" : "hidden"}>${fn()}</section>`).join("")}`;
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".needle").forEach(n => n.style.transform = `rotate(${-90 + 1.8 * +n.dataset.v}deg)`)));
}
function refreshUniverseRows() { const el = $("#uni-rows"); if (el) el.innerHTML = renderUniverseRows(); }

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-close]")) return closeSheet();
  const tog = t.closest("[data-toggle]"); if (tog) return toggleShortlist(tog.dataset.toggle, tog);
  if (t.closest("[data-save-settings]")) return saveSettings();
  if (t.closest("[data-forget]")) { store.set("token", ""); toast("Token removed from this browser."); return closeSheet(); }
  if (t.closest("#open-settings")) return openSettings();
  const cr = t.closest("[data-coin]"); if (cr) return openSheet(cr.dataset.coin);
  const tab = t.closest("[data-tab]");
  if (tab) {
    current = tab.dataset.tab; history.replaceState(null, "", "#" + current);
    document.querySelectorAll("[role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === current));
    document.querySelectorAll("[role=tabpanel]").forEach(s => s.hidden = s.id !== "tab-" + current);
    return;
  }
  const chip = t.closest("[data-filter]");
  if (chip) { ui.filter = chip.dataset.filter; ui.shown = 40;
    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b.dataset.filter === ui.filter)); return refreshUniverseRows(); }
  if (t.closest("[data-more]")) { ui.shown += 40; return refreshUniverseRows(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && e.target.matches("tr[data-coin]")) openSheet(e.target.dataset.coin);
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { ui.q = e.target.value; ui.shown = 40; refreshUniverseRows(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { ui.sort = e.target.value; ui.shown = 40; refreshUniverseRows(); }
  if (e.target.id === "lsort") { ui.lsort = e.target.value; const s = $("#tab-levels"); if (s) s.innerHTML = renderLevels(); }
});
window.addEventListener("popstate", () => closeSheet(true));

function stamp() {
  if (!DATA) return;
  const el = $("#stamp"), stale = (Date.now() - new Date(DATA.generated_at)) / 3.6e6 > 2;
  el.textContent = "Updated " + when(DATA.generated_at) + (stale ? ", tracker may be paused" : "");
  el.title = "Data collected " + new Date(DATA.generated_at).toLocaleString();
  el.classList.toggle("stale", stale);
}
const getJson = p => fetch(p + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
function absorb(data, uni) {
  DATA = data; if (uni) UNI = uni;
  BYID = new Map();
  (UNI?.coins || []).forEach(c => BYID.set(c.id, c));
  (data.shortlist || []).forEach(c => { if (!BYID.has(c.id)) BYID.set(c.id, c); });
}
// pick up a new hourly run without a manual reload: on return to the page and every 5 minutes
async function refresh() {
  if (document.hidden || !DATA || $("#layer").innerHTML) return stamp();  // don't redraw under an open sheet
  const [data, radar] = await Promise.all([getJson("data.json"), getJson("radar.json")]);
  let changed = false;
  if (radar && radar.generated_at !== RADAR?.generated_at) { RADAR = radar; changed = true; }
  if (data && data.generated_at !== DATA.generated_at) {
    const uni = data.universe_at !== UNI?.generated_at ? await getJson("universe.json") : null;
    absorb(data, uni); changed = true;
  }
  if (changed) { const y = scrollY; render(); scrollTo(0, y); }
  stamp();
}

(async function boot() {
  const [data, uni, sl, radar] = await Promise.all([getJson("data.json"), getJson("universe.json"), getJson("shortlist.json"), getJson("radar.json")]);
  RADAR = radar;
  if (!data) {
    $("#stamp").textContent = "No data";
    $("#app").innerHTML = `<p class="empty">No data yet. Open your repo on GitHub, go to Actions, pick <b>Collect market data</b> and press <b>Run workflow</b>. This page fills in a few minutes later.</p>`;
    return;
  }
  absorb(data, uni);
  const cached = store.get("shortlist_cache");
  SHORT = new Set(cached && Date.now() - cached.at < 15 * 60 * 1000 ? cached.coins : (sl?.coins || []));
  stamp();
  if (!TABS.some(([id]) => id === current)) current = "shortlist";
  render();
  if (gh().token) ghFetchShortlist().then(r => { SHORT = new Set(r.coins); render(); }).catch(() => {});
  setInterval(refresh, 5 * 60 * 1000);
  setInterval(stamp, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
